version: '3.8'

services:
  logistics-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logistics-reasoning-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./weights:/workspace/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
